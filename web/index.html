<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1a2e">
<title>wg-manage web</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 1rem; max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.3rem; }
  textarea { width: 100%; min-height: 12rem; background: #16213e; color: #eee; border: 1px solid #0f3460; border-radius: 6px; font-family: monospace; padding: .5rem; box-sizing: border-box; }
  button { background: #0f3460; color: #fff; border: 0; border-radius: 6px; padding: .5rem 1rem; margin: .25rem .25rem .25rem 0; cursor: pointer; }
  button:hover { background: #1a4a8a; }
  #status { color: #7fd; min-height: 1.2em; }
  #peers { margin: .5rem 0; }
  .peer { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: .5rem .75rem; margin: .25rem 0; display: flex; justify-content: space-between; cursor: pointer; }
  .peer:hover { border-color: #4a9; }
  .badge { font-size: .75rem; padding: .1rem .4rem; border-radius: 4px; background: #0f3460; }
  .badge.server { background: #2d6a4f; }
  pre { background: #0d1526; padding: .75rem; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
  #confView { display: none; }
</style>
</head>
<body>
<h1>wg-manage web <span id="ver" style="font-size:.8rem;color:#7fd"></span></h1>
<p id="status">loading wasm…</p>
<div id="app" hidden>
  <div>
    <button id="btnBootstrap">Bootstrap demo config</button>
    <button id="btnParse">Parse / validate YAML</button>
    <button id="btnViz">Visualize</button>
  </div>
  <h2>Peers</h2>
  <div id="peers"></div>
  <h2>config.yaml</h2>
  <textarea id="yaml" spellcheck="false"></textarea>
  <h2>Selected peer config</h2>
  <div id="confView"><pre id="conf"></pre></div>
  <pre id="vizOut" hidden></pre>
</div>
<script src="wasm_exec.js"></script>
<script src="app.js"></script>
</body>
</html>
