name: Web (wasm/PWA)

on:
  push:
    paths:
      - 'wasm/**'
      - 'web/**'
      - 'models/**'
      - 'viz/**'
      - 'wg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/wasm.yml'
      - 'scripts/build-wasm.sh'
  workflow_dispatch:

jobs:
  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run wasm API tests under Node
        run: |
          GOOS=js GOARCH=wasm go test -c -o /tmp/wasm-tests.wasm ./wasm/
          cat > /tmp/run-wasm-tests.js <<'EOF'
          const fs = require('fs');
          require(process.env.GOROOT_WASM + '/wasm_exec.js');
          (async () => {
            const go = new Go();
            go.exit = (code) => process.exit(code);
            const bytes = fs.readFileSync('/tmp/wasm-tests.wasm');
            const result = await WebAssembly.instantiate(bytes, go.importObject);
            go.run(result.instance);
            setTimeout(() => process.exit(2), 60000);
          })();
          EOF
          GOROOT_WASM="$(go env GOROOT)/lib/wasm" node /tmp/run-wasm-tests.js

  build:
    runs-on: ubuntu-latest
    needs: test-wasm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Build wasm + PWA assets
        run: scripts/build-wasm.sh

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v7
        with:
          name: wg-manage-web
          path: web/dist/*
